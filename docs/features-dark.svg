<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 580" width="820" height="580">
  <style>
    text { font-family: 'JetBrains Mono', 'SF Mono', 'Cascadia Code', 'Fira Code', 'Consolas', monospace; }
  </style>

  <!-- Background -->
  <rect width="820" height="580" rx="12" fill="#0a0a0c"/>

  <!-- Subtle grid dots -->
  <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse">
    <circle cx="12" cy="12" r="0.5" fill="#1a1a2e"/>
  </pattern>
  <rect width="820" height="580" fill="url(#dots)" opacity="0.6"/>

  <!-- Row 1 -->
  <!-- Card: Page Cloning -->
  <g transform="translate(20, 20)">
    <rect width="382" height="76" rx="10" fill="#12121a" stroke="#1e1e2e" stroke-width="1"/>
    <!-- DNA helix icon -->
    <g transform="translate(18, 18)">
      <path d="M4,0 C8,8 16,8 20,0" fill="none" stroke="#00c8ff" stroke-width="2" stroke-linecap="round"/>
      <path d="M4,10 C8,2 16,2 20,10" fill="none" stroke="#00c8ff" stroke-width="2" stroke-linecap="round"/>
      <line x1="7" y1="2" x2="7" y2="8" stroke="#00c8ff" stroke-width="1.5" opacity="0.5"/>
      <line x1="12" y1="1" x2="12" y2="9" stroke="#00c8ff" stroke-width="1.5" opacity="0.5"/>
      <line x1="17" y1="2" x2="17" y2="8" stroke="#00c8ff" stroke-width="1.5" opacity="0.5"/>
    </g>
    <text x="52" y="34" fill="#00c8ff" font-size="13" font-weight="bold">Page Cloning</text>
    <text x="52" y="54" fill="#888" font-size="10">Chrome headless render + cURL fallback</text>
  </g>

  <!-- Card: MITM Proxy -->
  <g transform="translate(418, 20)">
    <rect width="382" height="76" rx="10" fill="#12121a" stroke="#1e1e2e" stroke-width="1"/>
    <!-- Shuffle/proxy icon -->
    <g transform="translate(18, 20)">
      <path d="M0,4 L12,4 L16,0" fill="none" stroke="#7c5cff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M0,14 L12,14 L16,18" fill="none" stroke="#7c5cff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M16,0 L20,4 L16,8" fill="none" stroke="#7c5cff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M16,10 L20,14 L16,18" fill="none" stroke="#7c5cff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
    <text x="52" y="34" fill="#7c5cff" font-size="13" font-weight="bold">MITM Proxy</text>
    <text x="52" y="54" fill="#888" font-size="10">Reverse proxy with URL &amp; XHR rewrite</text>
  </g>

  <!-- Row 2 -->
  <!-- Card: Credential Sniffing -->
  <g transform="translate(20, 112)">
    <rect width="382" height="76" rx="10" fill="#12121a" stroke="#1e1e2e" stroke-width="1"/>
    <!-- Key icon -->
    <g transform="translate(18, 18)">
      <circle cx="7" cy="7" r="6" fill="none" stroke="#00c8ff" stroke-width="2"/>
      <line x1="12" y1="9" x2="22" y2="19" stroke="#00c8ff" stroke-width="2" stroke-linecap="round"/>
      <line x1="22" y1="19" x2="18" y2="19" stroke="#00c8ff" stroke-width="2" stroke-linecap="round"/>
      <line x1="19" y1="16" x2="19" y2="19" stroke="#00c8ff" stroke-width="2" stroke-linecap="round"/>
    </g>
    <text x="52" y="34" fill="#00c8ff" font-size="13" font-weight="bold">Credential Sniffing</text>
    <text x="52" y="54" fill="#888" font-size="10">Form, JSON, GraphQL, Livewire, Inertia</text>
  </g>

  <!-- Card: Login Verification -->
  <g transform="translate(418, 112)">
    <rect width="382" height="76" rx="10" fill="#12121a" stroke="#1e1e2e" stroke-width="1"/>
    <!-- Checkmark icon -->
    <g transform="translate(18, 18)">
      <rect x="0" y="0" width="22" height="22" rx="5" fill="none" stroke="#00e68a" stroke-width="2"/>
      <path d="M5,12 L9,16 L17,6" fill="none" stroke="#00e68a" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
    <text x="52" y="34" fill="#00e68a" font-size="13" font-weight="bold">Login Verification</text>
    <text x="52" y="54" fill="#888" font-size="10">Auto-detect success via status &amp; redirect</text>
  </g>

  <!-- Row 3 -->
  <!-- Card: Session Hijacking -->
  <g transform="translate(20, 204)">
    <rect width="382" height="76" rx="10" fill="#12121a" stroke="#1e1e2e" stroke-width="1"/>
    <!-- Cookie icon -->
    <g transform="translate(18, 18)">
      <circle cx="11" cy="14" r="8" fill="none" stroke="#ff9f43" stroke-width="2"/>
      <circle cx="7" cy="13" r="1.5" fill="#ff9f43"/>
      <circle cx="13" cy="16" r="1.5" fill="#ff9f43"/>
      <circle cx="11" cy="10" r="1.5" fill="#ff9f43"/>
    </g>
    <text x="52" y="34" fill="#ff9f43" font-size="13" font-weight="bold">Session Hijacking</text>
    <text x="52" y="54" fill="#888" font-size="10">Cookie-Editor JSON for instant replay</text>
  </g>

  <!-- Card: Camera Capture -->
  <g transform="translate(418, 204)">
    <rect width="382" height="76" rx="10" fill="#12121a" stroke="#1e1e2e" stroke-width="1"/>
    <!-- Camera icon -->
    <g transform="translate(18, 18)">
      <rect x="1" y="6" width="20" height="14" rx="3" fill="none" stroke="#00c8ff" stroke-width="2"/>
      <circle cx="11" cy="13" r="4" fill="none" stroke="#00c8ff" stroke-width="2"/>
      <path d="M7,6 L9,2 L15,2 L17,6" fill="none" stroke="#00c8ff" stroke-width="1.5"/>
    </g>
    <text x="52" y="34" fill="#00c8ff" font-size="13" font-weight="bold">Camera Capture</text>
    <text x="52" y="54" fill="#888" font-size="10">Periodic webcam snapshots + revoke</text>
  </g>

  <!-- Row 4 -->
  <!-- Card: Mic Recording -->
  <g transform="translate(20, 296)">
    <rect width="382" height="76" rx="10" fill="#12121a" stroke="#1e1e2e" stroke-width="1"/>
    <!-- Microphone icon -->
    <g transform="translate(18, 16)">
      <rect x="7" y="0" width="8" height="14" rx="4" fill="none" stroke="#7c5cff" stroke-width="2"/>
      <path d="M3,12 C3,18 8,22 11,22 C14,22 19,18 19,12" fill="none" stroke="#7c5cff" stroke-width="2" stroke-linecap="round"/>
      <line x1="11" y1="22" x2="11" y2="26" stroke="#7c5cff" stroke-width="2" stroke-linecap="round"/>
      <line x1="7" y1="26" x2="15" y2="26" stroke="#7c5cff" stroke-width="2" stroke-linecap="round"/>
    </g>
    <text x="52" y="34" fill="#7c5cff" font-size="13" font-weight="bold">Mic Recording</text>
    <text x="52" y="54" fill="#888" font-size="10">Audio clips from visitor's microphone</text>
  </g>

  <!-- Card: Geolocation -->
  <g transform="translate(418, 296)">
    <rect width="382" height="76" rx="10" fill="#12121a" stroke="#1e1e2e" stroke-width="1"/>
    <!-- Pin/location icon -->
    <g transform="translate(18, 16)">
      <path d="M11,2 C6,2 2,6 2,11 C2,18 11,26 11,26 C11,26 20,18 20,11 C20,6 16,2 11,2 Z" fill="none" stroke="#ff6b6b" stroke-width="2"/>
      <circle cx="11" cy="11" r="3" fill="none" stroke="#ff6b6b" stroke-width="2"/>
    </g>
    <text x="52" y="34" fill="#ff6b6b" font-size="13" font-weight="bold">Geolocation</text>
    <text x="52" y="54" fill="#888" font-size="10">GPS pings with coordinates &amp; accuracy</text>
  </g>

  <!-- Row 5 -->
  <!-- Card: Device Fingerprint -->
  <g transform="translate(20, 388)">
    <rect width="382" height="76" rx="10" fill="#12121a" stroke="#1e1e2e" stroke-width="1"/>
    <!-- Monitor icon -->
    <g transform="translate(18, 18)">
      <rect x="0" y="0" width="22" height="16" rx="2" fill="none" stroke="#00c8ff" stroke-width="2"/>
      <line x1="11" y1="16" x2="11" y2="20" stroke="#00c8ff" stroke-width="2"/>
      <line x1="6" y1="20" x2="16" y2="20" stroke="#00c8ff" stroke-width="2" stroke-linecap="round"/>
      <circle cx="11" cy="8" r="1.5" fill="#00c8ff" opacity="0.6"/>
    </g>
    <text x="52" y="34" fill="#00c8ff" font-size="13" font-weight="bold">Device Fingerprint</text>
    <text x="52" y="54" fill="#888" font-size="10">Browser, OS, screen &amp; hardware (always on)</text>
  </g>

  <!-- Card: Custom JS -->
  <g transform="translate(418, 388)">
    <rect width="382" height="76" rx="10" fill="#12121a" stroke="#1e1e2e" stroke-width="1"/>
    <!-- Code brackets icon -->
    <g transform="translate(18, 18)">
      <path d="M7,2 L1,11 L7,20" fill="none" stroke="#00e68a" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M15,2 L21,11 L15,20" fill="none" stroke="#00e68a" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
      <line x1="13" y1="0" x2="9" y2="22" stroke="#00e68a" stroke-width="1.5" opacity="0.5"/>
    </g>
    <text x="52" y="34" fill="#00e68a" font-size="13" font-weight="bold">Custom JS</text>
    <text x="52" y="54" fill="#888" font-size="10">Inject scripts over the runtime API</text>
  </g>

  <!-- Row 6 -->
  <!-- Card: Homograph Generator -->
  <g transform="translate(20, 480)">
    <rect width="382" height="76" rx="10" fill="#12121a" stroke="#1e1e2e" stroke-width="1"/>
    <!-- Globe icon -->
    <g transform="translate(18, 17)">
      <circle cx="11" cy="11" r="10" fill="none" stroke="#7c5cff" stroke-width="2"/>
      <ellipse cx="11" cy="11" rx="5" ry="10" fill="none" stroke="#7c5cff" stroke-width="1.2"/>
      <line x1="1" y1="8" x2="21" y2="8" stroke="#7c5cff" stroke-width="1.2"/>
      <line x1="1" y1="14" x2="21" y2="14" stroke="#7c5cff" stroke-width="1.2"/>
    </g>
    <text x="52" y="34" fill="#7c5cff" font-size="13" font-weight="bold">Homograph Generator</text>
    <text x="52" y="54" fill="#888" font-size="10">9 confusion sets + RDAP availability</text>
  </g>

  <!-- Card: Live SSE Stream -->
  <g transform="translate(418, 480)">
    <rect width="382" height="76" rx="10" fill="#12121a" stroke="#1e1e2e" stroke-width="1"/>
    <!-- Signal/broadcast icon -->
    <g transform="translate(18, 17)">
      <circle cx="11" cy="18" r="3" fill="#ff9f43"/>
      <path d="M4,12 C4,6 8,2 11,2 C14,2 18,6 18,12" fill="none" stroke="#ff9f43" stroke-width="2" stroke-linecap="round"/>
      <path d="M0,14 C0,4 5,-1 11,-1 C17,-1 22,4 22,14" fill="none" stroke="#ff9f43" stroke-width="1.5" stroke-linecap="round" opacity="0.5"/>
    </g>
    <text x="52" y="34" fill="#ff9f43" font-size="13" font-weight="bold">Live SSE Stream</text>
    <text x="52" y="54" fill="#888" font-size="10">Server-Sent push for cred &amp; session alerts</text>
  </g>
</svg>